name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]

jobs:
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias del backend (reproducible)
        run: npm ci --prefix backend

      - name: Instalar dependencias de test (reproducible)
        run: npm ci

      - name: Lint (sintaxis + funciones duplicadas, sin dependencias)
        run: npm run lint

      - name: Tests unitarios (DATA_DIR aislado)
        run: npm run test:unit
        env:
          CI: "true"

      - name: Instalar Chromium de Playwright
        run: npx playwright install --with-deps chromium

      - name: Tests E2E
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Subir informe de Playwright
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore
